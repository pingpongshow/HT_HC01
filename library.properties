sentence=Hardware driver for the Heltec HT-HC01 Wi-Fi HaLow (IEEE 802.11ah) module, based on the Morse Micro MM6108.
paragraph=Provides host-side control of the HT-HC01: reset / wake / busy power-state sequencing, hibernate handshake, SPI bus transport on the module's SDIO-alternate pins, and chip-interrupt handling. Serves as the hardware porting layer for integrating the Morse Micro Wi-Fi HaLow driver stack (mm-iot-sdk / esp-halow), which supplies the 802.11ah MAC and firmware.
